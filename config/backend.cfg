Backend.Endpoints=tcp -h 127.0.0.1 -p 10000
Ice.Warn.Connections=0
Ice.MessageSizeMax=65536

# Proxy al Nodo 4 (repositorio)
Repositorio.Proxy=repositorio:tcp -h 127.0.0.1 -p 10003

# Estrategias del Nodo 3 (una entrada por medio; agregar BILLETERA fue solo esto)
Estrategias.Metodos=TARJETA,PSE,CRIPTO,BILLETERA
Estrategia.TARJETA.Proxy=estrategia-tarjeta:tcp -h 127.0.0.1 -p 10001
Estrategia.PSE.Proxy=estrategia-pse:tcp -h 127.0.0.1 -p 10001
Estrategia.CRIPTO.Proxy=estrategia-cripto:tcp -h 127.0.0.1 -p 10001
Estrategia.BILLETERA.Proxy=estrategia-billetera:tcp -h 127.0.0.1 -p 10001

# Parámetros del backend
Pagos.TimeoutAcuseMs=1500
Pagos.Breaker.UmbralFallos=3
Pagos.Breaker.EnfriamientoMs=15000
Pagos.HilosPosproceso=8