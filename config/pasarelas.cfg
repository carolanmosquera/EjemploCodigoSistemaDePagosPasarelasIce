# Configuracion del Nodo 3 (pasarelas de pago simuladas)
# El backend las busca en: Estrategia.<METODO>.Proxy=estrategia-<metodo>:tcp -h 127.0.0.1 -p 10001
Pasarelas.Endpoints=tcp -h 127.0.0.1 -p 10001
Ice.Warn.Connections=0
Ice.MessageSizeMax=65536

# Varios hilos de despacho: una pasarela lenta o caida (PSE) no debe bloquear a las demas
Ice.ThreadPool.Server.Size=4
Ice.ThreadPool.Server.SizeMax=16
